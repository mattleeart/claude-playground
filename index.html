<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Markdown Viewer</title>
  <link rel="manifest" href="app.webmanifest" />
  <link rel="icon" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MD Viewer" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <!-- Lock screen -->
  <section id="lock" class="lock" aria-label="패턴 잠금 화면">
    <div class="lock-inner">
      <div class="lock-icon">🔒</div>
      <h1 class="lock-title">패턴을 그려 잠금 해제</h1>
      <p id="lock-hint" class="lock-hint">9개의 점을 이어 패턴을 입력하세요</p>
      <div id="pattern" class="pattern" role="application" aria-label="패턴 입력">
        <svg id="pattern-lines" class="pattern-lines" viewBox="0 0 300 300" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="pattern-dots" id="pattern-dots"></div>
      </div>
    </div>
  </section>

  <!-- App -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <button id="menu-btn" class="icon-btn read-only" aria-label="목록 열기">☰</button>
      <button id="cancel-edit" class="icon-btn edit-only" aria-label="편집 취소">✕</button>
      <h1 id="doc-title" class="topbar-title">문서</h1>
      <button id="save-edit" class="icon-btn edit-only" aria-label="저장">💾</button>
      <button id="edit-btn" class="icon-btn read-only" aria-label="편집">✏️</button>
      <button id="settings-btn" class="icon-btn read-only" aria-label="설정">⚙️</button>
      <button id="lock-btn" class="icon-btn read-only" aria-label="잠그기">🔒</button>
      <div id="progress" class="progress"></div>
    </header>

    <div id="settings" class="settings-panel" hidden>
      <div class="settings-row">
        <span class="settings-label">테마</span>
        <div class="seg" id="theme-seg">
          <button data-theme-val="auto" class="seg-btn">자동</button>
          <button data-theme-val="light" class="seg-btn">밝게</button>
          <button data-theme-val="dark" class="seg-btn">어둡게</button>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-label">글자 크기</span>
        <div class="seg">
          <button id="font-dec" class="seg-btn">A−</button>
          <button id="font-reset" class="seg-btn">기본</button>
          <button id="font-inc" class="seg-btn">A+</button>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-label">문서</span>
        <div class="seg">
          <button id="share-btn" class="seg-btn">공유</button>
          <button id="copylink-btn" class="seg-btn">링크 복사</button>
        </div>
      </div>
      <div class="settings-row settings-token">
        <label class="settings-label" for="gh-token">GitHub 토큰</label>
        <input id="gh-token" class="token-input" type="password" autocomplete="off" placeholder="ghp_… (편집 저장용)" />
      </div>
      <div class="settings-row settings-token-actions">
        <small class="settings-hint">repo contents:write 권한. 이 기기에만 저장됩니다.</small>
        <button id="gh-token-clear" class="seg-btn">삭제</button>
      </div>
    </div>

    <div id="backdrop" class="backdrop" hidden></div>

    <nav id="drawer" class="drawer" aria-label="문서 목록">
      <div class="drawer-head">문서 목록</div>
      <input id="filter" class="filter" type="search" placeholder="제목·본문 검색…" aria-label="문서 검색" />
      <ul id="file-list" class="file-list"></ul>
      <ul id="search-results" class="file-list" hidden></ul>
      <div id="toc-head" class="drawer-head" hidden>목차</div>
      <ul id="toc" class="toc"></ul>
    </nav>

    <main id="content" class="content markdown-body">
      <p class="placeholder">문서를 불러오는 중…</p>
    </main>

    <section id="editor" class="editor" hidden aria-label="마크다운 편집기">
      <div class="editor-toolbar" id="editor-toolbar" role="toolbar" aria-label="서식">
        <button class="tb" data-action="heading" title="제목" aria-label="제목">H</button>
        <button class="tb" data-action="bold" title="굵게" aria-label="굵게"><b>B</b></button>
        <button class="tb" data-action="italic" title="기울임" aria-label="기울임"><i>I</i></button>
        <button class="tb" data-action="strike" title="취소선" aria-label="취소선"><s>S</s></button>
        <button class="tb" data-action="code" title="인라인 코드" aria-label="인라인 코드">&lt;/&gt;</button>
        <button class="tb" data-action="codeblock" title="코드 블록" aria-label="코드 블록">{ }</button>
        <button class="tb" data-action="link" title="링크" aria-label="링크">🔗</button>
        <button class="tb" data-action="image" title="이미지" aria-label="이미지">🖼</button>
        <button class="tb" data-action="quote" title="인용" aria-label="인용">❝</button>
        <button class="tb" data-action="ul" title="목록" aria-label="목록">•</button>
        <button class="tb" data-action="ol" title="번호 목록" aria-label="번호 목록">1.</button>
        <button class="tb" data-action="task" title="체크리스트" aria-label="체크리스트">☐</button>
        <button class="tb" data-action="hr" title="구분선" aria-label="구분선">—</button>
        <span class="tb-sep"></span>
        <button class="tb" data-action="preview" title="미리보기" aria-label="미리보기">👁</button>
      </div>
      <div class="editor-stack">
        <textarea id="editor-textarea" class="editor-textarea" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"></textarea>
        <div id="editor-preview" class="editor-preview markdown-body" hidden></div>
      </div>
      <div id="editor-status" class="editor-status"></div>
    </section>

    <button id="to-top" class="to-top" aria-label="맨 위로" hidden>↑</button>
  </div>

  <script src="assets/marked.min.js"></script>
  <script src="assets/purify.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
